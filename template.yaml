            TableName: !Ref RemarcaTable
      Events:
        LoginApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RemarcaApi
            Path: /auth/login
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - src/handlers/auth.ts

  ValidateTokenFunction:

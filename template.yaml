      Events:
        RefreshTokenApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref RemarcaApi
            Path: /auth/refresh
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        EntryPoints:
          - src/handlers/auth.ts

  # Patient Functions
  CreatePatientFunction:
